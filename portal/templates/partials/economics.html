<div class="card">
  <div class="card-head"><div><h3>Holding economics</h3><p>Electricity to keep this season's stock cold</p></div><span class="tag">Estimate</span></div>
  <div class="card-body">
    <dl class="mini-stats" style="margin:0">
      <div><dt>Power cost, season</dt><dd data-bind="econ-cost"></dd><dd data-bind="econ-rate"></dd></div>
      <div><dt>Per tonne stored</dt><dd data-bind="econ-per-t"></dd><dd>over the storage season</dd></div>
      <div><dt>Energy used</dt><dd data-bind="econ-energy"></dd><dd data-bind="econ-tm"></dd></div>
      <div><dt>Harvest after what-if</dt><dd data-bind="shock-prod"></dd><dd data-bind="shock-base"></dd></div>
    </dl>
  </div>
</div>

<div class="palette no-print" id="palette" role="dialog" aria-modal="true" aria-label="Search ColdFlow" hidden>
  <div class="palette-backdrop" data-palette-close></div>
  <div class="palette-box">
    <div class="palette-input">
      <span aria-hidden="true">⌕</span>
      <input id="palette-input" type="text" placeholder="Search pages and actions…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
      <kbd>Esc</kbd>
    </div>
    <ul class="palette-list" id="palette-list" role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span>Type a question and press <kbd>↵</kbd> to ask the assistant</span></div>
  </div>
</div>
